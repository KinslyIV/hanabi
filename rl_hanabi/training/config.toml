# Hanabi Self-Play Training Configuration
# Example configurations for different training scenarios

# =============================================================================
# Default Configuration
# =============================================================================
# A balanced configuration for general training

[default]
# Random seed for reproducibility
seed = 34

# Device configuration (auto, cpu, cuda, cuda:0, etc.)
device = "auto"

# =============================================================================
# Model Architecture
# =============================================================================
[model]
# Maximum game dimensions (model is trained to handle up to these)
max_players = 3
max_colors = 5
max_ranks = 5
max_hand_size = 5
max_info_tokens = 8
max_life_tokens = 3

# Transformer architecture
num_heads = 4
num_layers = 4
d_model = 512
action_dim = 4
dropout = 0.1

# =============================================================================
# Training Hyperparameters
# =============================================================================
[training]
# Optimizer settings
learning_rate = 1e-4
weight_decay = 0
max_grad_norm = 1.0

# Training loss mode: "actor_critic" or "supervised"
loss_mode = "supervised"

# Optional auxiliary behavior cloning (cross-entropy) loss on a subset of steps.
# Set bc_loss_weight > 0 to enable.
bc_loss_weight = 0.0

# Probability of attaching a teacher label on "obvious" states (e.g., fully-known playable card).
teacher_label_prob = 0.0

# Learning rate scheduler
scheduler_t0 = 1000
scheduler_t_mult = 2
min_lr = 1e-6
critic_loss_weight = 1.0
entropy_loss_weight = 0.05

# Batch size
batch_size = 8

# =============================================================================
# Self-Play Configuration
# =============================================================================
[selfplay]
# Games to play per iteration
games_per_iteration = 100

# Data source for training transitions: "selfplay" or "bot"
data_source = "bot"

# Bot policy sampling options (used when data_source="bot")
bot_stochastic = false
bot_temperature = 1

# Training steps per iteration
train_steps_per_iteration = 500

# Total number of iterations
num_iterations = 100

# Replay buffer size (number of transitions)
buffer_size = 50000

# =============================================================================
# Game Configuration
# =============================================================================
# Fixed game settings for training
[game_config]
num_players = 3
num_colors = 5
num_ranks = 5

# =============================================================================
# Exploration Parameters
# =============================================================================
[exploration]
# Temperature for action sampling (higher = more random)
temperature = 1.5

# Temperature decay per iteration (set to 0 to disable)
temperature_decay = 0.01

# Minimum temperature
min_temperature = 0.1

# =============================================================================
# Logging and Checkpointing
# =============================================================================
[logging]
# Log training metrics every N steps
log_interval = 50

# Save checkpoint every N iterations
save_interval = 10

# Checkpoint directory
checkpoint_dir = "./checkpoints"

# Buffer save directory (optional)
buffer_dir = "./buffer_dir"

# =============================================================================
# Play Configuration
# =============================================================================
[play]
# Device for play script (auto, cpu, cuda, cuda:0, etc.)
device = "auto"

# Checkpoint location (uses checkpoint_latest.pt if present)
checkpoint_dir = "./checkpoints"
checkpoint = ""

# Action selection settings
temperature = 0
topk = 5

# Display settings
show_hands = true
max_turns = 0

# Use H-Group bots for non-model players
use_bots = false
model_player = 0
bot_stochastic = false
bot_temperature = 1.0

# Game seed (-1 = random)
seed = -1

# =============================================================================
# Weights & Biases Configuration
# =============================================================================
[wandb]
# Enable WandB logging
enabled = true

# WandB project name
project = "hanabi-selfplay"

# Run name (optional, auto-generated if not specified)
run_name = "gear4-snake-man"

# Tags for this run (comma-separated)
tags = "self-play,training"

# wandb directory
dir_path = "./wandb"

# =============================================================================
# Preset Configurations
# =============================================================================

# -----------------------------------------------------------------------------
# Quick Test Configuration
# For testing the training pipeline quickly
# -----------------------------------------------------------------------------
[presets.quick_test]
num_iterations = 5
games_per_iteration = 20
train_steps_per_iteration = 100
batch_size = 8
buffer_size = 10000
log_interval = 10
save_interval = 5

# -----------------------------------------------------------------------------
# 2-Player Only Configuration
# Focus on 2-player games for simpler training
# -----------------------------------------------------------------------------
[presets.two_player]
num_players = 2
games_per_iteration = 200
train_steps_per_iteration = 1000

# -----------------------------------------------------------------------------
# Full Hanabi Configuration
# Train on standard 5-color, 5-rank games only
# -----------------------------------------------------------------------------
[presets.full_hanabi]
num_colors = 5
num_ranks = 5
games_per_iteration = 150
train_steps_per_iteration = 750

# -----------------------------------------------------------------------------
# Large Scale Training
# For serious training runs
# -----------------------------------------------------------------------------
[presets.large_scale]
games_per_iteration = 500
train_steps_per_iteration = 2000
num_iterations = 500
batch_size = 512
buffer_size = 500000
d_model = 256
num_layers = 6
num_heads = 8
learning_rate = 3e-4

# -----------------------------------------------------------------------------
# Debug Configuration
# Minimal configuration for debugging
# -----------------------------------------------------------------------------
[presets.debug]
num_players = 3
max_players = 3
num_iterations = 2
games_per_iteration = 5
train_steps_per_iteration = 10
batch_size = 8
buffer_size = 1000
log_interval = 1
save_interval = 1
wandb_enabled = false
